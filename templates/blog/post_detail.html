{% extends 'base.html' %}
{% block title %}{{ post.titulo }}{% endblock %}
{% block content %}
<h1>{{ post.titulo }}</h1>
<p class="meta">Publicado em {{ post.data_postagem|date:"d/m/Y H:i" }}</p>
<div>{{ post.conteudo|safe }}</div>
<hr>
<p>
  <a href="{% url 'post_update' post.pk %}">Editar</a> |
  <a href="{% url 'post_delete' post.pk %}">Remover</a> |
  <a href="{% url 'post_list' %}">Voltar à listagem</a>
</p>
{% endblock %}
