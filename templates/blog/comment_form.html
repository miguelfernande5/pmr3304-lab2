{% extends 'base.html' %}
{% block title %}Novo comentário{% endblock %}
{% block content %}
<h1>Novo comentário</h1>
<p>Comentando em: <a href="{% url 'post_detail' post.pk %}">{{ post.titulo }}</a></p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Publicar comentário</button>
  <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
</form>
{% endblock %}
