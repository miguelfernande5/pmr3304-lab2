{% extends 'base.html' %}
{% block title %}Remover post{% endblock %}
{% block content %}
<h1>Remover post</h1>
<p>Tem certeza de que deseja remover o post <strong>"{{ post.titulo }}"</strong>? Esta ação não pode ser desfeita.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Sim, remover</button>
  <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
</form>
{% endblock %}
