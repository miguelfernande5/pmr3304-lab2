{% extends 'base.html' %}
{% block title %}Posts{% endblock %}
{% block content %}
<h1>Posts</h1>
<ul>
  {% for post in posts %}
    <li>
      <a href="{% url 'post_detail' post.pk %}">{{ post.titulo }}</a>
      <span class="meta">({{ post.data_postagem|date:"d/m/Y H:i" }})</span>
    </li>
  {% empty %}
    <li>Nenhum post cadastrado.</li>
  {% endfor %}
</ul>
<p><a href="{% url 'post_create' %}">Criar novo post</a></p>
{% endblock %}
